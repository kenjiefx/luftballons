<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="text/javascript" src="assets/plunc.js"></script>
    <script type="module" src="app/main.js"></script>
    <script src="assets/tailwind.js"></script>
    <style>
      html {
        width: 400px;
        height: 500px;
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans">
    <main plunc-app="Luftballoons"></main>

    <template plunc-name="Luftballoons">
      <section class="w-full h-full p-6 flex flex-col">
        <!-- Header -->
        <div class="mb-6">
          <h1 class="text-xl font-semibold text-gray-900 mb-2">Tool Builder</h1>
          <p class="text-sm text-gray-600 leading-relaxed">
            Create tools you need to update and retrieve data, however you like
            it.
          </p>
        </div>
        <hr class="border-gray-200 mb-6" />
        <section plunc-component="Main"></section>
      </section>
    </template>

    <template plunc-name="Main">
      <div plunc-if="state=='home'">
        <section plunc-component="HomePage"></section>
      </div>
      <div plunc-if="state=='create-bulk-update-tool'">
        <section plunc-component="CreateBulkUpdateToolPage"></section>
      </div>
    </template>

    <template plunc-name="HomePage">
      <div class="flex flex-col space-y-1 flex-1">
        <!-- Card 1 -->
        <button
          class="text-left bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md hover:border-gray-300 transition-all duration-200 group"
          plunc-click="handleUpdateBuilderClick()"
        >
          <div class="flex items-start justify-between">
            <div>
              <h2
                class="text-sm font-semibold text-gray-900 group-hover:text-gray-800"
              >
                Create Mass Update Tool
              </h2>
              <p class="text-xs text-gray-500 mt-1 leading-relaxed">
                Build a tool to update multiple records in bulk with custom
                rules.
              </p>
            </div>

            <!-- Icon -->
            <div class="ml-3 text-gray-400 group-hover:text-gray-600">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </div>
          </div>
        </button>

        <!-- Card 2 -->
        <button
          class="text-left bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md hover:border-gray-300 transition-all duration-200 group"
        >
          <div class="flex items-start justify-between">
            <div>
              <h2
                class="text-sm font-semibold text-gray-900 group-hover:text-gray-800"
              >
                Create Report Tool
              </h2>
              <p class="text-xs text-gray-500 mt-1 leading-relaxed">
                Generate and export reports based on the data you need.
              </p>
            </div>

            <!-- Icon -->
            <div class="ml-3 text-gray-400 group-hover:text-gray-600">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </div>
          </div>
        </button>

        <div class="pt-3"></div>
        <hr class="border-gray-200" />
        <div class="pb-3"></div>

        <!-- Tool List -->
         <section>
            <h2 class="text-sm font-semibold text-gray-900 mb-2">My Tools</h2>
            <div plunc-if="tools.length == 0" class="text-sm text-gray-500">
              You haven't created any tools yet.
            </div>
            <div plunc-repeat="tools as tool">
              <div class="flex items-center justify-between bg-white border border-gray-200 rounded-2xl p-4 shadow-sm mb-2">
                <div>
                  <h3 class="text-sm font-medium text-gray-900">{{ tool.name }}</h3>
                  <p class="text-xs text-gray-500 mt-1">{{ tool.description }}</p>
                </div>
                <div class="ml-3 text-gray-400">
                  <button
                    plunc-click="handleOpenToolClick('{{tool.id}}')"
                    class="text-blue-600 hover:text-blue-800 transition-colors duration-200"
                  >
                    Open
                  </button>
                </div>
            </div>
         </section>
      </div>
    </template>

    <template plunc-name="CreateBulkUpdateToolPage">
      <div class="w-full">
        <div class="flex items-center w-full">
          <!-- Step 1 (Active) -->
          <div class="flex items-center">
            <div
              plunc-style="styleActiveStep(1)"
              class="w-4 h-4 flex items-center justify-center rounded-full text-sm font-semibold"
            >
              1
            </div>
            <span
              plunc-style="styleActiveStepTitle(1)"
              class="ml-1 text-xs font-medium whitespace-nowrap"
            >
              Select Domain
            </span>
          </div>

          <!-- Divider -->
          <div class="flex-1 h-px bg-gray-300 mx-3"></div>

          <!-- Step 2 -->
          <div class="flex items-center">
            <div
              plunc-style="styleActiveStep(2)"
              class="w-4 h-4 flex items-center justify-center rounded-full text-sm font-semibold"
            >
              2
            </div>
            <span
              plunc-style="styleActiveStepTitle(2)"
              class="ml-1 text-xs font-medium whitespace-nowrap"
            >
              Choose Fields
            </span>
          </div>

          <!-- Divider -->
          <div class="flex-1 h-px bg-gray-300 mx-3"></div>

          <!-- Step 3 -->
          <div class="flex items-center">
            <div
              plunc-style="styleActiveStep(3)"
              class="w-4 h-4 flex items-center justify-center rounded-full text-sm font-semibold"
            >
              3
            </div>
            <span
              plunc-style="styleActiveStepTitle(3)"
              class="ml-1 text-xs font-medium whitespace-nowrap"
            >
              Create Tool
            </span>
          </div>
        </div>
      </div>
      <div plunc-if="step == 1" class="py-4 space-y-1">
        <button
          plunc-click="handleDomainSelect('listings')"
          class="text-left bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md hover:border-gray-300 transition-all duration-200 group"
        >
          <div class="flex items-start justify-between">
            <div>
              <h2
                class="text-sm font-semibold text-gray-900 group-hover:text-gray-800"
              >
                Listings
              </h2>
              <p class="text-xs text-gray-500 mt-1 leading-relaxed">
                Update listing details like title, description, price, and more
                in bulk.
              </p>
            </div>

            <!-- Icon -->
            <div class="ml-3 text-gray-400 group-hover:text-gray-600">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </div>
          </div>
        </button>

        <button
          class="text-left bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md hover:border-gray-300 transition-all duration-200 group"
        >
          <div class="flex items-start justify-between">
            <div>
              <h2
                class="text-sm font-semibold text-gray-900 group-hover:text-gray-800"
              >
                Reservations
              </h2>
              <p class="text-xs text-gray-500 mt-1 leading-relaxed">
                Update reservation details like dates, guest info, and more in
                bulk.
              </p>
            </div>

            <!-- Icon -->
            <div class="ml-3 text-gray-400 group-hover:text-gray-600">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </div>
          </div>
        </button>

        <button
          class="text-left bg-white border border-gray-200 rounded-2xl p-4 shadow-sm hover:shadow-md hover:border-gray-300 transition-all duration-200 group"
        >
          <div class="flex items-start justify-between">
            <div>
              <h2
                class="text-sm font-semibold text-gray-900 group-hover:text-gray-800"
              >
                Owners
              </h2>
              <p class="text-xs text-gray-500 mt-1 leading-relaxed">
                Update owner details like contact info, preferences, and more in
                bulk.
              </p>
            </div>

            <!-- Icon -->
            <div class="ml-3 text-gray-400 group-hover:text-gray-600">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-5 h-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 5l7 7-7 7"
                />
              </svg>
            </div>
          </div>
        </button>
      </div>

      <div plunc-if="step == 2" class="py-4 space-y-1">
        <div plunc-if="domain == 'listings'">
          <p class="text-sm text-gray-600 mb-2">
            Select the fields you want to bulk update for the listings:
          </p>
          <div plunc-repeat="listingFields as listingField">
            <label class="flex items-center space-x-2">
              <input
                type="checkbox"
                plunc-check="$parent.isListingFieldSelected(listingField)"
                plunc-change="toggleSelectField('{{listingField}}')"
                class="form-checkbox h-4 w-4 text-blue-600 transition duration-150 ease-in-out"
              />
              <span class="text-sm text-gray-700">{{ listingField }}</span>
            </label>
          </div>
          <div>
            <button
              plunc-click="goToCreateToolStep()"
              class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors duration-200"
            >
              Next
            </button>
          </div>
        </div>
      </div>

      <div plunc-if="step == 3" class="py-4 space-y-1">
        <div>
          <div class="relative max-w-xs">
            <input
                type="text"
                plunc-model="toolName"
                placeholder="Tool Name"
                class="w-full pl-1 pr-3 py-2 text-gray-500 bg-transparent outline-none border focus:border-indigo-600 shadow-sm rounded-lg"
            />
          </div>

          <div class="relative max-w-xs mt-3">
            <input
                type="text"
                plunc-model="toolDescription"
                placeholder="Tool Description"
                class="w-full pl-1 pr-3 py-2 text-gray-500 bg-transparent outline-none border focus:border-indigo-600 shadow-sm rounded-lg"
            />
          </div>

          <p class="text-sm text-gray-600 mt-3">
            Review your selections and create the tool:
          </p>

          <h3 class="text-sm font-medium text-gray-900 mt-3">Domain: {{ domain }}</h3>

          <h3 class="text-sm font-medium text-gray-900">Fields to Update:</h3>
          <ul plunc-repeat="getSelectedListingsFields() as field" class="list-disc list-inside mb-4">
            <li
              class="text-sm text-gray-700"
            >
              {{ field }}
            </li>
          </ul>

          <button
            plunc-click="handleCreateTool()"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors duration-200"
          >
            Create Tool
          </button>
        </div>
    </template>

    <style>
      input[type="checkbox"].form-checkbox:checked {
        --tw-bg-opacity: 1;
        background-color: rgb(59 130 246 / var(--tw-bg-opacity, 1));
        border-color: rgb(59 130 246 / var(--tw-border-opacity, 1));
      }
      .active-step {
        --tw-bg-opacity: 1;
        background-color: rgb(59 130 246 / var(--tw-bg-opacity, 1));
        color: white;
      }
      .inactive-step {
        --tw-bg-opacity: 1;
        background-color: #d1d5db / var(--tw-bg-opacity, 1);
        color: #374151;
      }
      .active-step-title {
        color: rgb(17 24 39 / var(--tw-text-opacity, 1));
        font-weight: 500;
      }
      .inactive-step-title {
        color: rgb(107 114 128 / var(--tw-text-opacity, 1));
        font-weight: 400;
      }
    </style>
  </body>
</html>
